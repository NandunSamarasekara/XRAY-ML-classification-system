version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    environment:
      # Override the local .env to point to the docker ecosystem databases
      - DATABASE_URL=postgresql://user:password@postgres:5432/xraydb
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app

  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  redis:
    image: redis:stable-alpine
    ports:
      - "6379:6379"

  celery:
    build: 
      context: ./backend
    command: celery -A app.tasks worker --loglevel=info
    depends_on:
      - redis
      - postgres
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/xraydb
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: xraydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
